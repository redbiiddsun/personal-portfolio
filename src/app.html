<!doctype html>
<html lang="en">
<head>
  <!-- Charset first: browsers only look for it in the first 1024 bytes. -->
  <meta charset="UTF-8" />
  <!-- Google tag (gtag.js) and Microsoft Clarity -->
  <!-- Runs only on the production host; keep the hostname in sync with SITE_URL in src/lib/data.ts. -->
  <!-- Analytics cookies stay off until the visitor accepts in CookieConsent.svelte (storage key "consent", see src/lib/consent.svelte.ts); the choice goes to Google Consent Mode v2 and Clarity's Consent API v2 (consentv2). -->
  <script>
    (function () {
      if (location.hostname !== 'redbiiddsun.com') return;
      window.dataLayer = window.dataLayer || [];
      window.gtag = function gtag(){ dataLayer.push(arguments); };
      var hasConsent = false;
      try { hasConsent = localStorage.getItem('consent') === 'granted'; } catch (error) {}
      gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: hasConsent ? 'granted' : 'denied' });

      var gtagLoader = document.createElement('script');
      gtagLoader.async = true;
      gtagLoader.src = 'https://www.googletagmanager.com/gtag/js?id=G-BB9H2QXLCQ';
      document.head.appendChild(gtagLoader);

      gtag('js', new Date());

      gtag('config', 'G-BB9H2QXLCQ');

      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "z2d1cdsh94");
      clarity('consentv2', { ad_Storage: 'denied', analytics_Storage: hasConsent ? 'granted' : 'denied' });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
  <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Google Sans Flex / Plus Jakarta / Noto Sans Thai: body; Itim, Caveat: handwritten notes; Sacramento: intro signature. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Itim&family=Caveat:wght@500;700&family=Sacramento&display=swap" />
  %sveltekit.head%
</head>
<body>
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>

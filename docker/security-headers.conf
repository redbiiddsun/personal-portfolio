# nginx drops inherited add_header once a location sets its own, so every location that
# adds a header of its own includes this file instead of repeating the list.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# Cloudflare terminates TLS, so the origin emits this over http for Cloudflare to
# pass on to the client over https. A UA ignores it on a non-secure response.
add_header Strict-Transport-Security "max-age=63072000" always;
